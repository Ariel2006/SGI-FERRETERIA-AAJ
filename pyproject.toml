[project]
name = "sgi-ferreteria-aaj"
version = "0.1.0"
description = "SGI-Ferretería: sistema web de gestión de inventario (caso práctico ISO/IEC 29110)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
